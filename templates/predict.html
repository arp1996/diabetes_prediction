<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeartDisease Prediction Form</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-image:url('https://www.myheart.org.sg/wp-content/uploads/2019/04/Diabetes-and-Heart-Disease_-Whats-the-Connection_-scaled.jpg');">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">HeartDisease Prediction</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="/">Welcome to {{user.username}} !! </a>
                </li>
                        
                <li class="nav-item active">
                    <a class="nav-link" href="/">Home</a>
                </li>
               
                <li class="nav-item">
                    <a class="nav-link" href="/predict">Predict</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout1">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h2>HeartDisease Prediction Form</h2>
                    </div>
                    <div class="card-body">
                        <form method="POST" action='/result'>
                            {% csrf_token %}
                            
                            <div class="form-group">
                                <label for="glucose">RestingBP:</label>
                                <input type="number" class="form-control" id="RestingBP" name="RestingBP" required>
                            </div>
                            <div class="form-group">
                                <label for="blood_pressure">Cholesterol:</label>
                                <input type="number" class="form-control" id="Cholesterol" name="Cholesterol" required>
                            </div>
                            <div class="form-group">
                                <label for="skin_thickness">FastingBS:</label>
                                <input type="number" class="form-control" id="FastingBS" name="FastingBS" required>
                            </div>
                            <div class="form-group">
                                <label for="insulin">MaxHR:</label>
                                <input type="number" class="form-control" id="MaxHR" name="MaxHR" required>
                            </div>
                            <div class="form-group">
                                <label for="bmi">Oldpeak:</label>
                                <input type="number" step="0.1" class="form-control" id="bmi" name="Oldpeak" required>
                            </div>
                           
                            <button type="submit" class="btn btn-primary btn-block">Predict</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
<br><br><br><br>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
